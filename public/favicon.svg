<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Onomastikon mark: the wordmark's sigma in oxblood on a parchment tile.
       The media query follows the OS scheme so the mark stays legible against
       dark browser chrome. -->
  <rect class="tile" width="128" height="128" rx="24" fill="#f5efe4"/>
  <path class="glyph" fill="#6b3a2a" d="M38 30 L92 30 L92 44 L60 44 L82 64 L60 84 L92 84 L92 98 L38 98 L38 88 L64 64 L38 40 Z"/>
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #211e18; }
      .glyph { fill: #d29978; }
    }
  </style>
</svg>
