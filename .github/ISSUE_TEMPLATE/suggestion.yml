name: Suggestion (new name, entity, or language)
description: Propose a new civilization, city, region, geographic feature, language, or name form.
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see added?
      description: The entity, language, or name form you are proposing, and why it belongs in the atlas.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Sources or context (optional)
      description: Attestations, dictionaries, or texts that document the form.
